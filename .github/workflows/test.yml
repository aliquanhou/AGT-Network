name: AGT Network Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify chain integrity (module import check)
        run: |
          python -c "
          from agt_node.node import AGTNode
          from impact_oracle.oracle import ImpactOracle
          from reward_ledger.economy.protocol_fee import ProtocolFeeEngine
          print('All critical modules import successfully')
          "
